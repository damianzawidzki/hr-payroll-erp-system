{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Login | HRHub Pro</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 
        Main stylesheet for HRHub Pro.
        The version number forces the browser to load the newest CSS file.
    -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
</head>
<body class="login-body">

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-brand">
            <img
                src="{% static 'pictures/logo.png' %}"
                alt="HRHub Pro Logo"
                class="login-logo-image"
            >

            <h1>HRHub Pro</h1>
            <p>Professional HR & Payroll ERP System</p>
        </div>

        {% if form.errors %}
            <div class="alert-error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter your username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Sign In</button>
        </form>

        <div class="login-footer">
            <p>Demo business system for portfolio project</p>
        </div>

    </div>

</div>

</body>
</html>
