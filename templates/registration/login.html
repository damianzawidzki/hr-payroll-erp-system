{% load statistic %}

<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">

        <title>Login | HRHub Pro</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Main CSS file for the HRHub Pro system -->
         <link ref="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body class="login-body">

        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-brand">
                    <!--This logo is stored inside static/pictures/logo.png-->
                    <img
                        src="{% static 'picture/logo.png' %}"
                        alt="HRHub Pro Logo"
                        class="login-logo-image"
                    >

                    <h1>HRHub Pro</h1>
                    <p>Professional HR & Payroll ERP System</p>
                </div>

                {% if form.errors %}
                    <div class="alert-error">
                        Invalid username or password. Please try again.
                    </div>
                {% end if %}

                <form method="post" class="login-form">
                    {% csrf_token %}

                    <lable for="id_username">Username</lable>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        required
                    >
                    
                    <button type="submit">Sign In</button>
                </form>

                <div class="login-footer">
                    <p>HRHub Pro business webside</p>
                </div>
            </div>
        </div>
    </body>
</html>
